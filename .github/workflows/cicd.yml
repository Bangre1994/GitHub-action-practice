name: CICD

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        run: echo "cloning the code"

  build:
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Build using Docker
        run: echo "Building using Docker"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Running test case
        run: echo "Testing the app"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy on the machine
        run: echo "Deploying the code"
